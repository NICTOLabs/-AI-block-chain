<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <style>
    .bg { fill: #020617; }
    .card { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; rx: 8; }
    .text { font-family: monospace; font-size: 11px; fill: #e2e8f0; }
    .muted { fill: #94a3b8; }
    @keyframes slide { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .slide { animation: slide 1s ease-out; }
  </style>
  <rect width="800" height="320" class="bg" />
  <text x="20" y="30" class="text" fill="#38bdf8">Human Wallet Formation</text>
  <g transform="translate(60,70)" class="slide">
    <rect x="0" y="0" width="160" height="100" class="card" />
    <text x="10" y="25" class="text">Human A - CLI/SDK</text>
    <text x="10" y="45" class="text">Keypair: Ed25519</text>
    <text x="10" y="65" class="text">Address: 0xHumanA...</text>
    <text x="10" y="85" class="text muted">Balance: 1,000 TENDER</text>
  </g>
  <g transform="translate(320,70)" class="slide">
    <rect x="0" y="0" width="160" height="100" class="card" />
    <text x="10" y="25" class="text">Human B - Dashboard</text>
    <text x="10" y="45" class="text">Keypair: Ed25519</text>
    <text x="10" y="65" class="text">Address: 0xHumanB...</text>
    <text x="10" y="85" class="text muted">Balance: 500 TENDER</text>
  </g>
  <g transform="translate(580,70)" class="slide">
    <rect x="0" y="0" width="160" height="100" class="card" />
    <text x="10" y="25" class="text">TENDER Network</text>
    <text x="10" y="45" class="text">Secure Transport</text>
    <text x="10" y="65" class="text">Validator Consensus</text>
    <text x="10" y="85" class="text muted">Reversible Payments</text>
  </g>
  <text x="60" y="230" class="text" fill="#f8fafc">Humans create wallets via CLI, SDK, or browser dashboard.</text>
  <text x="60" y="255" class="text" fill="#94a3b8">Fund wallets, discover AI models, and purchase services on-chain.</text>
</svg>
