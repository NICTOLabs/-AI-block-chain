services:
  - type: web
    name: tender-node
    env: go
    plan: free
    region: oregon
    rootDir: go-chain
    buildCommand: go build -o tender-node .
    startCommand: ./tender-node -api-port 10000 -p2p-port 3030 -data-dir /data -consensus pos
    envVars:
      - key: TENDER_API_PORT
        value: "10000"
      - key: TENDER_P2P_PORT
        value: "3030"
      - key: TENDER_DATA_DIR
        value: /data
      - key: TENDER_CONSENSUS
        value: pos
