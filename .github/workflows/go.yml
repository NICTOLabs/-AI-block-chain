name: go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: true
      - run: cd go-chain && go build ./...
      - run: cd go-chain && go vet ./...
      - run: cd go-chain && go test -count=1 ./...
