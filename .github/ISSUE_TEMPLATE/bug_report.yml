name: Bug Report
description: Create a report to help us improve TENDER
title: "[BUG] "
labels: ["bug"]
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out this form as completely as possible.

        **Note**: This project is proprietary software owned by NICTOLabs. All contributions are subject to NICTOLabs terms and conditions.

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of TENDER are you using?
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Run command '...'
        3. Observe behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
      placeholder: Expected behavior...

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened
      placeholder: Actual behavior...

  - type: textarea
    id: logs
    attributes:
      label: Logs and Output
      description: Please include any relevant log output or error messages
      placeholder: Paste logs here...
